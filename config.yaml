default_region: Morocco-Rif
bbox:
  min_lat: 30.0
  min_lon: -10.0
  max_lat: 37.0
  max_lon: 0.0
input_dirs:
  modis: data/raw/modis
  viirs: data/raw/viirs
  environmental: data/raw/environmental
output_dirs:
  satellite: data/processed/satellite
  harmonized: data/processed/harmonized
  environmental: data/processed/environmental
  iot: data/iot
  models: models/trained
  metadata: models/metadata
harmonization:
  max_distance_km: 2.5
  max_time_hours: 12
  evidence_formula: "frp * 1.2 + confidence * 0.5 + count * 3"
  false_positive_rules: []
thresholds:
  risk:
    low: 0.0
    moderate: 0.4
    high: 0.7
    critical: 0.9
  iot:
    match_distance_km: 12.0
    match_time_hours: 6.0
replay:
  default_speed: 2.0
  max_days: 30
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
